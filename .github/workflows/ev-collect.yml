name: EV collector
# Every 10 minutes: one Belib' snapshot, status changes appended as CSV to the ev-data branch.
# GitHub may delay or skip scheduled runs when busy; snapshots.csv records the real coverage.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write  # push to the ev-data branch only (main is never written)
concurrency:
  group: ev-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Get the data branch (created on the first run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin ev-data > /dev/null; then
            git clone --quiet --depth 1 --branch ev-data "$url" evdata
          else
            mkdir evdata && cd evdata && git init --quiet -b ev-data && git remote add origin "$url"
          fi
      - name: Snapshot
        id: snap
        run: |
          set +e
          python scripts/ev_collect_csv.py --data evdata
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit data
        run: |
          cd evdata
          git config user.name "ev-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit --quiet -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --quiet origin ev-data
          fi
      - name: Fail the run if the snapshot failed or the feed was stale
        if: steps.snap.outputs.code != '0'
        run: |
          echo "collector exit code ${{ steps.snap.outputs.code }} (1 = fetch failed, 2 = stale feed)"
          exit 1
