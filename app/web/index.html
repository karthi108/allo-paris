<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allô Paris</title>
<meta name="description" content="Live Paris transport answers from IDFM open data, by phone or on the web.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #16181d; --muted: #5f6672; --line: #e3e1dc;
  --accent: #1f4fd6; --ok: #137a3f; --warn: #a35a00; --bad: #b3261e; --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111317; --panel: #191c21; --ink: #ecedf0; --muted: #9aa1ad; --line: #2a2e35;
    --accent: #7ea2ff; --ok: #4cc27f; --warn: #f0a640; --bad: #ff7a70; --chip: #23272e; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex;
  flex-direction: column; overflow-y: auto; }
#map { height: 100%; overflow: hidden; }
header { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.phone { margin-top: 10px; font-size: 14px; }
.phone a { color: var(--accent); font-weight: 600; text-decoration: none; }
section { padding: 14px 20px; border-bottom: 1px solid var(--line); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  margin-bottom: 8px; }
form { display: flex; gap: 6px; }
input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: transparent; }
button[aria-pressed=true] { outline: 2px solid var(--accent); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.examples button { font-size: 13px; padding: 5px 9px; }
.answer { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bg);
  border: 1px solid var(--line); min-height: 20px; white-space: pre-wrap; }
.answer:empty { display: none; }
.pill { display: inline-flex; align-items: center; justify-content: center; min-width: 28px;
  height: 24px; padding: 0 7px; border-radius: 6px; font-weight: 700; font-size: 13px;
  background: #888; color: #fff; border: 0; }
.board h2 { margin: 0 0 4px; font-size: 17px; }
.dep { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 8px 0;
  border-top: 1px solid var(--line); align-items: center; }
.dep:first-of-type { border-top: 0; }
.min { font-weight: 700; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line);
  color: var(--muted); }
.tag.rt { color: var(--ok); border-color: currentColor; }
.fresh { font-size: 12px; color: var(--muted); margin-top: 8px; }
.empty { color: var(--muted); font-size: 14px; }
.status { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
footer { padding: 14px 20px; font-size: 12px; color: var(--muted); margin-top: auto; }
footer a { color: var(--muted); }
.filters button { font-size: 12px; padding: 4px 9px; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 45vh 1fr; height: auto; min-height: 100vh; }
  #map { grid-row: 1; height: 45vh; }
  aside { grid-row: 2; border-right: 0; overflow: visible; }
  header, section, footer { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Allô Paris</h1>
      <div class="sub" id="tagline">Prochains départs en temps réel, par téléphone ou ici.</div>
      <div class="phone" id="phone" hidden>📞 <a id="phoneLink" href="#"></a></div>
    </header>

    <section>
      <div class="label" id="askLabel">Posez votre question</div>
      <form id="askForm" autocomplete="off">
        <input type="text" id="q" maxlength="300" placeholder="prochain RER A à Châtelet" aria-label="Question">
        <button type="button" id="mic" title="Parler" aria-label="Parler">🎤</button>
        <button type="submit" class="primary" id="send">OK</button>
      </form>
      <div class="row">
        <button type="button" id="langFr" aria-pressed="true">FR</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
        <label class="status"><input type="checkbox" id="speak"> <span id="speakLabel">Lire la réponse</span></label>
      </div>
      <div class="row examples" id="examples"></div>
      <div class="answer" id="answer" aria-live="polite"></div>
    </section>

    <section class="board" id="board">
      <div class="label" id="boardLabel">Station</div>
      <div class="empty" id="boardEmpty">Cliquez une station sur la carte.</div>
      <div id="boardBody" hidden>
        <h2 id="stopName"></h2>
        <div class="row" id="linePills"></div>
        <div id="deps" style="margin-top:10px"></div>
        <div class="fresh" id="fresh"></div>
      </div>
    </section>

    <section>
      <div class="label" id="mapLabel">Carte</div>
      <div class="row filters" id="filters"></div>
    </section>

    <footer>
      <div class="status"><span class="dot" id="feedDot"></span><span id="feedText">…</span></div>
      <p id="disclaimer">Projet non officiel, non affilié à Île-de-France Mobilités ni à la RATP.
        Données : <a href="https://prim.iledefrance-mobilites.fr" rel="noopener">IDFM PRIM</a> ·
        Carte : © OpenStreetMap.</p>
    </footer>
  </aside>
  <div id="map" role="region" aria-label="Carte des stations"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
